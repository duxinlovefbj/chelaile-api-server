name = "chelaile-api"
main = "index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat", "brotli_content_encoding"]

# Keep the *.workers.dev hostname as a fallback channel (note: blocked in
# mainland China). Set to false to expose the custom domain only.
workers_dev = true
preview_urls = false

# Primary public endpoint.
[[routes]]
pattern = "bus.duxinlovefbj.uk"
custom_domain = true

# Dataset: DATA_BASE_URL intentionally unset — the Worker falls back to the
# bundled data/cities.json (origin: "file"), then to the upstream API.

[observability]
enabled = true
